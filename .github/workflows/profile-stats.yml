name: Generate GitHub Profile Stats

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution graph and streak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ashmeer-raza
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import date, timedelta

          token = os.environ["GITHUB_TOKEN"]
          username = os.environ["GITHUB_USERNAME"]

          query = """
          query($login:String!) {
            user(login:$login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          body = json.dumps({
              "query": query,
              "variables": {"login": username}
          }).encode()

          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=body,
              headers={
                  "Authorization": f"bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "github-profile-stats"
              }
          )

          with urllib.request.urlopen(req) as response:
              data = json.load(response)

          if "errors" in data:
              raise SystemExit(json.dumps(data["errors"]))

          calendar = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days = [
              d
              for week in calendar["weeks"]
              for d in week["contributionDays"]
          ]

          counts = {d["date"]: d["contributionCount"] for d in days}
          today = date.today()

          current = 0
          cursor = today
          if counts.get(cursor.isoformat(), 0) == 0:
              cursor -= timedelta(days=1)

          while counts.get(cursor.isoformat(), 0) > 0:
              current += 1
              cursor -= timedelta(days=1)

          longest = 0
          run = 0
          for d in sorted(days, key=lambda x: x["date"]):
              if d["contributionCount"] > 0:
                  run += 1
                  longest = max(longest, run)
              else:
                  run = 0

          total = calendar["totalContributions"]

          os.makedirs("assets", exist_ok=True)

          def esc(s):
              return str(s).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          streak_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190" viewBox="0 0 820 190">
            <rect width="820" height="190" rx="12" fill="#0d1117"/>
            <text x="35" y="45" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="22" font-weight="700">🔥 GitHub Contribution Streak</text>
            <text x="35" y="88" fill="#8b949e" font-family="Arial,sans-serif" font-size="15">Current streak</text>
            <text x="35" y="125" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">{current} days</text>
            <text x="300" y="88" fill="#8b949e" font-family="Arial,sans-serif" font-size="15">Longest streak</text>
            <text x="300" y="125" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">{longest} days</text>
            <text x="570" y="88" fill="#8b949e" font-family="Arial,sans-serif" font-size="15">Contributions</text>
            <text x="570" y="125" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">{total}</text>
            <text x="35" y="160" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Generated automatically from GitHub contribution data.</text>
          </svg>'''

          graph_days = days[-371:]
          graph_svg = ['<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">']
          graph_svg.append('<rect width="900" height="180" rx="12" fill="#0d1117"/>')
          graph_svg.append('<text x="28" y="30" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="20" font-weight="700">📈 Contribution Graph</text>')

          start_x, start_y = 28, 50
          cell, gap = 11, 3
          for i, d in enumerate(graph_days):
              x = start_x + (i // 7) * (cell + gap)
              y = start_y + (i % 7) * (cell + gap)
              c = d["contributionCount"]
              fill = "#161b22" if c == 0 else "#0e4429" if c <= 2 else "#006d32" if c <= 5 else "#26a641" if c <= 9 else "#39d353"
              graph_svg.append(f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" fill="{fill}"><title>{esc(d["date"])}: {c} contributions</title></rect>')

          graph_svg.append('<text x="28" y="160" fill="#8b949e" font-family="Arial,sans-serif" font-size="12">Last 12 months • darker cells indicate more contributions</text>')
          graph_svg.append('</svg>')

          open("assets/github-streak.svg", "w", encoding="utf-8").write(streak_svg)
          open("assets/github-contribution-graph.svg", "w", encoding="utf-8").write("\n".join(graph_svg))
          PY

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg assets/github-contribution-graph.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub profile stats"
          git push
